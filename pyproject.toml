[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpointkit"
version = "0.2.0a1"
description = "Fault-tolerant checkpointing and resume toolkit for long-running AI, data, and batch jobs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "CheckpointKit contributors"}]
keywords = ["checkpoint", "resume", "batch", "recovery", "ai", "data-pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Recovery Tools",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jerry0327/checkpointkit"
Documentation = "https://github.com/jerry0327/checkpointkit/tree/main/docs"
Issues = "https://github.com/jerry0327/checkpointkit/issues"
Changelog = "https://github.com/jerry0327/checkpointkit/blob/main/CHANGELOG.md"
Repository = "https://github.com/jerry0327/checkpointkit"

[project.scripts]
checkpointkit = "checkpointkit.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
checkpointkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["checkpointkit"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

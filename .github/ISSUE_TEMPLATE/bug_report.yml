name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make recovery behavior more reliable.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands or a small code example when possible.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CheckpointKit version or commit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Relevant checkpoint state
      description: Redact secrets and sensitive paths before attaching state files.

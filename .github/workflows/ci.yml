name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src tests examples tools

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test with branch coverage
        run: pytest --cov=checkpointkit --cov-report=term-missing --cov-branch

  recovery:
    name: recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
          - os: windows-latest
            slug: windows
          - os: macos-latest
            slug: macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run real crash-and-resume scenario
        run: >-
          python examples/crash_resume_demo.py
          --workspace recovery-evidence
          --items 16
          --interrupt-after 5
          --delay 0.01
          --report recovery-evidence/recovery-report.json
          --reset
      - name: Upload recovery evidence
        uses: actions/upload-artifact@v7
        with:
          name: recovery-evidence-${{ matrix.slug }}
          path: recovery-evidence
          if-no-files-found: error
          retention-days: 30

  package:
    name: package
    needs: [lint, test, recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel smoke test
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          checkpointkit --version
          python -c "from checkpointkit import CheckpointStore; print(CheckpointStore)"

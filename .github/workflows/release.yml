name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate release metadata and eligibility
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_metadata.py \
            --notes release-notes.md \
            --github-output "$GITHUB_OUTPUT"

          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$current_main" != "$RELEASE_SHA" ]]; then
            echo "main advanced from $RELEASE_SHA to $current_main; a newer CI run will decide release eligibility"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="$(grep '^tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release artifacts
        if: steps.metadata.outputs.publish == 'true'
        run: |
          python -m pip install build
          python -m build
          (cd dist && sha256sum checkpointkit-* > SHA256SUMS)
      - name: Generate build provenance
        if: steps.metadata.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/checkpointkit-*.whl
            dist/checkpointkit-*.tar.gz
            dist/SHA256SUMS
      - name: Create GitHub release
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release create "$TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --target "$RELEASE_SHA"
            --title "CheckpointKit $TAG"
            --notes-file release-notes.md
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
